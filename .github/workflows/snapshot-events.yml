name: Snapshot events

# KV (ATTENDANCE_KV) is the live source of truth for the events calendar
# once an admin has edited via the local dashboard. Every 6 hours we
# snapshot the Worker's /events read and commit data/events.json if
# anything changed. The committed file is the bootstrap seed for fresh KV
# namespaces (see bootstrapEvents in worker/src/index.js), the SPA's
# fallback when the Worker is unreachable, and a git audit trail.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-events
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current events snapshot from Worker
        env:
          WORKER_ORIGIN: https://join.jxnfilm.club
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$WORKER_ORIGIN/events" \
            -o /tmp/snapshot.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/snapshot.json'))
          if not isinstance(data, list):
              sys.exit('snapshot is not a JSON array')
          if data and not all(isinstance(e, dict) and e.get('id') for e in data):
              sys.exit('snapshot rows missing required id field')
          PY

      - name: Rewrite data/events.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          rows = json.load(open('/tmp/snapshot.json'))

          # Screenings at a home are members-only and must never enter this
          # file: it is served publicly and committed to a public repo, where a
          # leak is permanent rather than merely visible.
          #
          # GET /events already excludes them for anonymous callers, and this
          # job calls it anonymously — so in the normal case nothing is dropped
          # here. This is the second line, and it is load-bearing precisely when
          # the first one is not: a failed or rolled-back worker deploy makes
          # the endpoint start serving house screenings again, and without this
          # the very next run would silently bot-commit one back into the public
          # file. The invariant belongs to the writer, not to whatever the
          # upstream happened to return.
          def members_only(e):
              return e.get('kind') == 'house' or (not e.get('kind') and e.get('hostId'))

          dropped = sum(1 for e in rows if members_only(e))
          rows = [e for e in rows if not members_only(e)]
          if dropped:
              # Not fatal — a stale snapshot is worse than a filtered one — but
              # loud, because it means GET /events is serving what it should not.
              #
              # COUNT ONLY, never ids. This repo is public, so Actions logs are
              # world-readable and permanent, and an event id is a slug carrying
              # the date and title. Naming them here would publish exactly what
              # the filter above exists to suppress — the same mistake as
              # letting one into data/events.json, in a different file. The
              # count is the whole operational signal: the endpoint is serving
              # what it should not, go look. Which ones is recoverable from KV,
              # where the data already lives behind access control.
              print(f'::warning::filtered {dropped} members-only event(s) '
                    f'that GET /events should not have returned')

          # Deterministic: sort by date ascending, then id for tie-breaks.
          rows.sort(key=lambda e: (e.get('date', ''), e.get('id', '')))
          pathlib.Path('data/events.json').write_text(
              json.dumps(rows, indent=2) + '\n'
          )
          PY

      - name: Commit if changed
        run: |
          git config user.name  "jxnfilmclub-bot"
          git config user.email "bot@jxnfilm.club"
          if git diff --quiet -- data/events.json; then
            echo "No event changes to commit"
          else
            git add data/events.json
            git commit -m "chore: snapshot events"
            git push
          fi
