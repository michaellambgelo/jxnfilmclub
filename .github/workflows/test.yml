name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - run: npm ci
      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Tee'd because the failures worth diagnosing are the ones where the
      # local Worker DIES mid-run: Playwright aborts before writing its HTML
      # report, so the upload below finds nothing and the only record of why
      # the process went away is this stdout. GitHub's default shell sets
      # pipefail, so the step still fails on a non-zero exit.
      - name: e2e
        run: npm run test:e2e 2>&1 | tee e2e.log

      - name: Upload e2e diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e.log
            .playwright-report/
            .test-results/
          if-no-files-found: warn
          retention-days: 7
