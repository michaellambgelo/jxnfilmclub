name: Update member

on:
  repository_dispatch:
    types: [update-member]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply edit to data/members.json
        env:
          ID:      ${{ github.event.client_payload.id }}
          UPDATES: ${{ toJSON(github.event.client_payload.updates) }}
        run: |
          # add-member and update-member can be dispatched moments apart (e.g.
          # a new member opens /profile and saves right after verifying) —
          # if this job's checkout lands before add-member's commit is
          # pushed, the row won't exist yet. Retry against a fresh pull a
          # few times before treating it as a real error (exit 42 is the
          # "not found (yet)" signal from the python script below).
          apply() {
            python3 - <<'PY'
          import json, os, pathlib, sys
          # Worker is the source of truth for authorization; this workflow just
          # applies an allow-listed set of fields to the matching member row.
          ALLOWED = {'name', 'pronouns', 'handle'}

          id_ = os.environ['ID']
          if not id_:
              raise SystemExit('client_payload.id is required')
          updates = json.loads(os.environ['UPDATES'])

          path = pathlib.Path('data/members.json')
          members = json.loads(path.read_text())

          for m in members:
              if m.get('id') == id_:
                  for k, v in updates.items():
                      if k not in ALLOWED:
                          continue
                      # Explicit null → remove the field from the public row.
                      # Absent keys are left alone by virtue of not being in `updates`.
                      if v is None:
                          m.pop(k, None)
                      else:
                          m[k] = v
                  break
          else:
              sys.exit(42)

          path.write_text(json.dumps(members, indent=2) + '\n')
          PY
          }

          attempt=1
          max_attempts=6
          while true; do
            if apply; then
              break
            fi
            status=$?
            if [ "$status" -ne 42 ]; then
              exit "$status"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::member not found after $max_attempts attempts: $ID"
              exit 1
            fi
            echo "member $ID not found yet (attempt $attempt/$max_attempts) — add-member's commit may still be in flight; retrying after pull"
            sleep 5
            git fetch origin main
            git reset --hard origin/main
            attempt=$((attempt + 1))
          done

      - name: Commit
        run: |
          git config user.name  "jxnfilmclub-bot"
          git config user.email "bot@jxnfilm.club"
          if git diff --quiet; then
            echo "No changes"
          else
            git add data/members.json
            git commit -m "chore: update member entry"
            git push
          fi
