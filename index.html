<!doctype dhtml>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<script>
  import { state } from 'state'

  // Shared with the same-route link guard below.
  const QUERY_KEYS = ['query', 'sort', 'venue', 'email', 'event', 'filter']

  state.setup({
    route: '/:type',
    query: QUERY_KEYS,
    autolink: true,
  })

  // Clicking the nav link for the page you are already on used to land you
  // on the site root with the view unchanged.
  //
  // nuestate's autolink turns any click whose pathname matches the SPA route
  // into `state.set(getURLData(link))`. getURLData spells absent query params
  // as null, while state.data has had its nulls stripped, so `undefined !==
  // null` registers a phantom change on every one of them. That marks the
  // change as `query`-only, and the query-only branch writes the URL as
  // `replaceState('./')` — which resolves against /watched to `/`, dropping
  // the path. No path param changed, so no view ever re-renders.
  //
  // Handle those clicks before autolink sees them: it bails on
  // defaultPrevented. Capture phase, so this does not depend on which
  // listener was registered first.
  addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]')
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return
    // Cross-origin (Join), another page, or an in-page anchor: not ours.
    if (a.origin !== location.origin || a.pathname !== location.pathname || a.hash) return
    e.preventDefault()
    // Clicking through to where you already are should still read as a
    // navigation, so go back to the top — what the browser itself does for
    // a link to the current page. (The four scrollIntoView calls in
    // ui/views.html predate this and do not check reduced motion.)
    scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
    // A link clicked while the URL carries filter/sort state means "give me
    // the clean view", so drop that state — then repair the path, since
    // clearing it walks straight back into the './' branch above.
    if (location.search) {
      for (const key of QUERY_KEYS) if (state[key] != null) state[key] = null
      history.replaceState(true, 0, a.pathname)
    }
  }, true)

  function resolveWorkerOrigin() {
    if (globalThis.JXNFC_WORKER_ORIGIN) return globalThis.JXNFC_WORKER_ORIGIN
    const override = new URLSearchParams(location.search).get('api')
    if (override === 'local') return 'http://localhost:8787'
    if (override === 'prod')  return 'https://join.jxnfilm.club'
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8787'
    return 'https://join.jxnfilm.club'
  }
  const WORKER_ORIGIN = resolveWorkerOrigin()

  // One-time "privacy policy updated" toast. The worker serves the policy's
  // revision date (parsed from the page itself); we compare it to a
  // per-browser ack in localStorage. First visit stores silently — a brand
  // new visitor has no earlier policy to be notified about. A later revision
  // returns true exactly once, then the fresh stamp suppresses it until the
  // next bump. Failures (offline, endpoint missing) resolve false: the toast
  // is a courtesy, never a blocker.
  async function checkPrivacyVersion() {
    try {
      const res = await fetch(WORKER_ORIGIN + '/privacy/version')
      if (!res.ok) return false
      const { updated } = await res.json()
      if (!updated) return false
      const seen = localStorage.jxnfc_privacy_ack
      localStorage.jxnfc_privacy_ack = updated
      return !!seen && seen !== updated
    } catch { return false }
  }

  function isSignedIn() {
    try {
      const raw = localStorage.jxnfc_session
      if (!raw) return false
      const s = JSON.parse(raw)
      // A remembered device counts as signed in even after the 1-hour token
      // lapses — the views silently refresh it on demand. If the refresh
      // token turns out to be revoked, /edit bounces to /signin as usual.
      return !!(s?.token && s.exp > Date.now()) || !!(s && s.refresh)
    } catch { return false }
  }

  // Where to land after a login. Deliberately NOT a ?next= query param:
  // nuestate reads and emits only the keys registered in state.setup, so an
  // unregistered param never survives an SPA navigation — and a REGISTERED one
  // is worse, because api.set() runs save() -> fire() -> pushURLState(), so
  // sign-in-view.mounted() would read the previous page's location.search.
  // sessionStorage sidesteps both and dies with the tab.
  //
  // Validated against a literal allowlist on BOTH write and read. Not a
  // regex: '//evil.example' and a backslash variant both look same-origin,
  // and backslashes in this codebase are their own hazard. Seven routes is
  // a short enough list to simply enumerate.
  const NEXT_OK = ['/speak', '/events', '/watched', '/members', '/host', '/feedback']

  globalThis.jxnfcStashNext = (path) => {
    try {
      if (NEXT_OK.includes(path)) sessionStorage.jxnfc_next = path
      else delete sessionStorage.jxnfc_next
    } catch { /* private mode, blocked storage: the landing just defaults */ }
  }

  globalThis.jxnfcNext = () => {
    try {
      const path = sessionStorage.jxnfc_next
      delete sessionStorage.jxnfc_next
      return NEXT_OK.includes(path) ? path : ''
    } catch { return '' }
  }

  // Work around Nue's autolink intercepting every anchor click. Autolink's
  // listener runs on the bubble phase at document level; a capture-phase
  // stopImmediatePropagation before it fires lets the browser handle
  // cross-origin and target="_blank" anchors natively.
  //
  // The same listener is where a login click is caught: it is the only place
  // that sees every anchor before autolink starts a route change. Guarded on
  // defaultPrevented because the same-path handler above preventDefaults
  // without stopping propagation.
  document.addEventListener('click', (e) => {
    const a = e.target?.closest?.('a[href]')
    if (!a) return
    const url = new URL(a.href, location.href)
    const external = url.origin !== location.origin
    if (!external && !e.defaultPrevented && url.pathname === '/signin' && location.pathname !== '/signin') {
      globalThis.jxnfcStashNext(location.pathname)
    }
    if (external || a.target === '_blank') {
      e.stopImmediatePropagation()
    }
  }, true)
</script>

<body>

  <header>
    <nav class="mastnav wrap { menuOpen ? 'open' : '' }">
      <a href="/" class="logo">
        <span class="logo-word">JXN Film Club</span>
        <span class="logo-stamp">Est. JXN MS</span>
      </a>
      <button type="button" class="nav-toggle"
        :onclick="toggleMenu"
        aria-label="Menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="mastnav-links">
        <a href="/members">Members</a>
        <a href="/events">Events</a>
        <a href="/watched">Watched</a>
        <a href="/speak">Speak</a>
        <a :if="!signedIn" href="https://join.jxnfilm.club/" class="auth-link">Join</a>
      </div>
      <!-- Log in lives OUTSIDE .mastnav-links so the hamburger never hides it:
           it was a dim link behind a collapsed menu, which made logging back
           in harder to find than joining for the first time. Join stays in
           the menu, so the masthead keeps exactly one solid red action. -->
      <div class="mastnav-auth">
        <a :if="!signedIn" href="/signin" class="nav-login">Log in</a>
        <a :if="signedIn" href="/edit" class="nav-login">Account</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <article/>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer-row">
      <span class="site-footer-mark">Jackson Film Club · Est. JXN MS</span>
      <nav class="site-footer-links">
        <a href="/feedback">Feedback</a>
        <a href="https://join.jxnfilm.club/privacy">Privacy</a>
        <a href="mailto:privacy@jxnfilm.club">Contact</a>
      </nav>
    </div>
  </footer>

  <feedback-widget/>

  <div class="policy-toast" :hidden="!policyToast" role="status">
    <a href="{ policyUrl }">Our privacy policy was updated</a>
    <button type="button" class="policy-toast-close" aria-label="Dismiss" :onclick="dismissPolicyToast">×</button>
  </div>

  <script>
    state.on('type', ({ type }) => {
      this.update({ signedIn: isSignedIn(), menuOpen: false })
      const view =
        type === 'members' ? 'members-view' :
        type === 'events'  ? 'events-view' :
        type === 'watched' ? 'watched-view' :
        type === 'signin'  ? 'sign-in-view' :
        type === 'verify'  ? 'verify-view' :
        type === 'edit'    ? 'edit-view' :
        type === 'host'    ? 'events-new-view' :  // member-only "host a screening" form
        type === 'speak'   ? 'speak-view' :       // member voice clips + messages for the podcast; in the nav since the message mode shipped
        type === 'feedback' ? 'feedback-view' :   // beta feedback form (anonymous ok)
                             'home-view'
      this.mount(view, 'article')
    })

    toggleMenu() {
      this.update({ menuOpen: !this.menuOpen })
    }

    dismissPolicyToast() {
      this.update({ policyToast: false })
    }

    mounted() {
      this.update({ signedIn: isSignedIn(), menuOpen: false, policyToast: false, policyUrl: WORKER_ORIGIN + '/privacy' })
      state.init()
      checkPrivacyVersion().then(show => {
        if (!show) return
        this.update({ policyToast: true })
        setTimeout(() => this.update({ policyToast: false }), 12000)
      })
    }
  </script>

</body>
