<!doctype dhtml>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<script>
  import { state } from 'state'

  state.setup({
    route: '/:type',
    query: ['query', 'sort', 'venue', 'email', 'event'],
    autolink: true,
  })

  function isSignedIn() {
    try {
      const raw = localStorage.jxnfc_session
      if (!raw) return false
      const s = JSON.parse(raw)
      return !!(s?.token && s.exp > Date.now())
    } catch { return false }
  }

  // Load the theme's Google Fonts at runtime. Nue strips custom <link> tags
  // from the dhtml head, and its CSS bundler hangs on remote @imports, so
  // injecting the stylesheet here is the only route that survives the build.
  for (const href of ['https://fonts.googleapis.com', 'https://fonts.gstatic.com']) {
    const pre = document.createElement('link')
    pre.rel = 'preconnect'
    pre.href = href
    if (href.includes('gstatic')) pre.crossOrigin = 'anonymous'
    document.head.appendChild(pre)
  }
  const fontCss = document.createElement('link')
  fontCss.rel = 'stylesheet'
  fontCss.href = 'https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700;1,900&family=Oswald:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap'
  document.head.appendChild(fontCss)

  // Work around Nue's autolink intercepting every anchor click. Autolink's
  // listener runs on the bubble phase at document level; a capture-phase
  // stopImmediatePropagation before it fires lets the browser handle
  // cross-origin and target="_blank" anchors natively.
  document.addEventListener('click', (e) => {
    const a = e.target?.closest?.('a[href]')
    if (!a) return
    const url = new URL(a.href, location.href)
    const external = url.origin !== location.origin
    if (external || a.target === '_blank') {
      e.stopImmediatePropagation()
    }
  }, true)
</script>

<body>

  <header>
    <nav class="mastnav wrap { menuOpen ? 'open' : '' }">
      <a href="/" class="logo">
        <span class="logo-word">JXN Film Club</span>
        <span class="logo-stamp">Est. JXN MS</span>
      </a>
      <button type="button" class="nav-toggle"
        :onclick="toggleMenu"
        aria-label="Menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="mastnav-links">
        <a href="/members">Members</a>
        <a href="/events">Events</a>
        <a href="/watched">Watched</a>
        <a :if="!signedIn" href="https://join.jxnfilm.club/" class="auth-link">Join</a>
        <a :if="!signedIn" href="/signin">Log in</a>
        <a :if="signedIn" href="/edit">Account Actions</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <article/>
  </main>

  <script>
    state.on('type', ({ type }) => {
      this.update({ signedIn: isSignedIn(), menuOpen: false })
      const view =
        type === 'members' ? 'members-view' :
        type === 'events'  ? 'events-view' :
        type === 'watched' ? 'watched-view' :
        type === 'signin'  ? 'sign-in-view' :
        type === 'verify'  ? 'verify-view' :
        type === 'edit'    ? 'edit-view' :
        type === 'host'    ? 'events-new-view' :  // member-only "host a screening" form
                             'home-view'
      this.mount(view, 'article')
    })

    toggleMenu() {
      this.update({ menuOpen: !this.menuOpen })
    }

    mounted() {
      this.update({ signedIn: isSignedIn(), menuOpen: false })
      state.init()
    }
  </script>

</body>
