<!doctype html>
<!-- Branded audiogram frame — screenshotted by scripts/make_audiogram.mjs
     with omitBackground:true. The body stays TRANSPARENT; four opaque panels
     surround the wave window and the "grill" inside it paints the bar-gap
     rhythm of .speak-wave (css/speak.css) — the ffmpeg waveform shows through
     the transparent slots when the PNG is composited on top.

     {{FORMAT}} → body class (f-16x9 | f-1x1 | f-9x16)
     {{WX}}/{{WY}}/{{WW}}/{{WH}} → wave-window rect, injected from FORMATS in
     scripts/lib/audiogram.mjs so JS and CSS can never disagree.
     {{TITLE}}/{{NAME}} → escaped text. NAME is the speaker credit and is
     the frame's second-loudest element after the prompt — the audiogram
     exists to attribute a member, so the attribution is not a footer.

     Colors and fonts come straight from /css/tokens.css (served by the CLI's
     ephemeral http server, so the self-hosted /fonts URLs resolve). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    position: relative;
    overflow: hidden;
    --wx: {{WX}}px; --wy: {{WY}}px; --ww: {{WW}}px; --wh: {{WH}}px;
  }
  body.f-16x9 { width: 1920px; height: 1080px; }
  body.f-1x1  { width: 1080px; height: 1080px; }
  body.f-9x16 { width: 1080px; height: 1920px; }

  /* ---- opaque ink everywhere except the wave window ---- */
  .panel { position: absolute; background: var(--bg); }
  .panel.top    { left: 0; right: 0; top: 0; height: var(--wy); }
  .panel.left   { left: 0; top: var(--wy); width: var(--wx); height: var(--wh); }
  .panel.right  { left: calc(var(--wx) + var(--ww)); right: 0; top: var(--wy); height: var(--wh); }
  .panel.bottom { left: 0; right: 0; top: calc(var(--wy) + var(--wh)); bottom: 0; }

  /* The grill: .speak-wave's 3px bar / 4px gap rhythm scaled ×4 —
     transparent 12px slots the waveform shows through, opaque 16px gaps. */
  .grill {
    position: absolute;
    left: var(--wx); top: var(--wy); width: var(--ww); height: var(--wh);
    background: repeating-linear-gradient(
      to right, transparent 0 12px, var(--bg) 12px 28px);
  }

  /* ---- branding (copied from .logo in css/global.css, scaled for video) ---- */
  .content { position: absolute; z-index: 1; left: var(--mx); right: var(--mx); }
  body { --mx: 100px; }
  body.f-16x9 { --mx: 120px; }

  .logo {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    color: var(--ink-strong);
  }
  .logo .logo-word {
    font-family: var(--font-label);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 40px;
  }

  /* The prompt line — rendered only when the CLI opts in; empty otherwise. */
  /* No prompt line → the speaker becomes the only item in the stack, and
     space-between puts a lone item at the TOP. The credit therefore inherits
     the display slot instead of floating above the wave with a hole over it. */
  .title:empty { display: none; }

  .title {
    font-family: var(--font-display);
    font-weight: 900;
    font-style: italic;
    letter-spacing: var(--tracking-tight);
    line-height: var(--lh-tight);
    color: var(--ink-strong);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* The speaker credit. Sits with the prompt in the stack above the wave,
     not in the footer — see .stack. */
  .speaker {
    font-family: var(--font-label);
    font-weight: 600;
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    color: var(--ink-strong);
    line-height: 1.15;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .speaker::before { content: "— "; color: var(--brand); }

  .credit {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 40px;
    border-top: 2px solid var(--line-2);
    padding-top: 28px;
  }
  .credit .site {
    font-family: var(--font-mono);
    font-weight: 400;
    color: var(--ink-4);
    font-size: 24px;
    flex-shrink: 0;
  }

  /* The prompt and the speaker share one box that spans from below the
     wordmark to just above the wave window, with the prompt pinned to the top
     of it and the speaker to the bottom. Anchoring the speaker to the wave
     rather than to the end of the prompt keeps it in the same place whether
     the prompt runs one line, four, or is omitted entirely. */
  .stack {
    top: var(--head-top);
    height: calc(var(--wy) - var(--head-top) - var(--stack-gap));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 48px;
  }

  /* ---- per-format placement ---- */
  .logo-row { top: 90px; }
  body { --head-top: 260px; --stack-gap: 64px; }
  .title    { font-size: 84px; -webkit-line-clamp: 3; }
  .speaker  { font-size: 66px; }
  .credit-row { top: calc(var(--wy) + var(--wh) + 44px); }

  body.f-1x1 .logo-row { top: 80px; }
  body.f-1x1 { --head-top: 240px; --stack-gap: 56px; }
  body.f-1x1 .title    { font-size: 62px; }
  body.f-1x1 .speaker  { font-size: 52px; }
  body.f-1x1 .credit-row { top: calc(var(--wy) + var(--wh) + 40px); }
  body.f-1x1 .logo .logo-word { font-size: 36px; }

  body.f-9x16 .logo-row { top: 140px; }
  body.f-9x16 { --head-top: 430px; --stack-gap: 90px; }
  body.f-9x16 .title    { font-size: 76px; -webkit-line-clamp: 5; }
  body.f-9x16 .speaker  { font-size: 62px; }
  body.f-9x16 .credit-row { top: calc(var(--wy) + var(--wh) + 56px); }
</style>
</head>
<body class="{{FORMAT}}">
  <div class="panel top"></div>
  <div class="panel left"></div>
  <div class="panel right"></div>
  <div class="panel bottom"></div>
  <div class="grill"></div>

  <div class="content logo-row">
    <span class="logo">
      <span class="logo-word">JXN Film Club</span>
    </span>
  </div>

  <div class="content stack">
    <div class="title">{{TITLE}}</div>
    <div class="speaker">{{NAME}}</div>
  </div>

  <div class="content credit-row">
    <div class="credit">
      <div class="site">jxnfilm.club</div>
    </div>
  </div>
</body>
</html>
