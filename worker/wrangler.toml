name = "jxnfilmclub-join"
main = "src/index.js"
compatibility_date = "2024-12-30"

# Production (default env): deployed from `main` branch.
routes = [
  { pattern = "join.jxnfilm.club/*", zone_name = "jxnfilm.club" }
]

# Mirrored by the module-rules plugin in tests/worker/vitest.config.ts —
# keep the two in sync.
rules = [
  { type = "Text", globs = ["**/*.html", "**/*.css"], fallthrough = true },
  { type = "Data", globs = ["**/*.ico"], fallthrough = true }
]

[[kv_namespaces]]
binding = "MEMBERS_KV"
id = "1a7b67fcd1944f5dbfa22656f9fac4e4"

[[kv_namespaces]]
binding = "ATTENDANCE_KV"
id = "6d5a467495fb47fcb9514e0a85bb3b20"

# Member voice clips (podcast submissions). A bucket-wide 60-day lifecycle
# rule is the retention promise — no scrub code involved. Bucket must exist
# before deploy: npx wrangler r2 bucket create jxnfilm-voice (+ lifecycle add
# jxnfilm-voice expire-60d --expire-days 60).
[[r2_buckets]]
binding = "VOICE"
bucket_name = "jxnfilm-voice"

# Newsletter flyer images. Deliberately a SEPARATE bucket from VOICE, and
# deliberately with NO lifecycle rule: Apple Mail and Outlook re-fetch from
# origin on every open, so an expiring object silently breaks flyers in
# newsletters delivered months ago. Putting these under jxnfilm-voice would
# inherit its bucket-wide 60-day expiry and do exactly that, on a delay.
# Bucket must exist before deploy:
#   npx wrangler r2 bucket create jxnfilm-news
[[r2_buckets]]
binding = "NEWS"
bucket_name = "jxnfilm-news"

[vars]
ENVIRONMENT = "production"
GITHUB_OWNER = "michaellambgelo"
GITHUB_REPO = "jxnfilmclub"
GITHUB_BRANCH = "main"
SITE_ORIGIN = "https://jxnfilm.club"
NEWSLETTER_FROM = "Jackson Film Club <noreply@join.jxnfilm.club>"
# OPTIONAL: a physical postal address for the newsletter footer (the strict
# CAN-SPAM line). Deliberately unset — never put a home address here; if the
# club gets a PO Box, add NEWSLETTER_POSTAL_ADDRESS = "..." back.

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN      - fine-grained PAT, Contents: Write on jxnfilmclub
#   RESEND_API_KEY    - Resend.com API key (free tier: 3k/mo)
#   OTP_SIGNING_KEY   - random string used to HMAC-sign session tokens
#   ADMIN_TOKEN       - bearer secret guarding POST /admin/newsletter/send + /admin/scrub + /admin/member/unlink + GET /admin/tmdb/search

# Daily privacy scrub (scrubPastEvents): 30 days after a screening, delete its
# rsvp:{id} record (attendee emails) and strip address/notes off event:{id}.
# 08:17 UTC = 02:17/03:17 Central, off-peak.
[triggers]
crons = ["17 8 * * *"]

# --- Staging env (deploys from `staging` branch) ---

[env.staging]
name = "jxnfilmclub-join-staging"
routes = [
  { pattern = "join-staging.jxnfilm.club/*", zone_name = "jxnfilm.club" }
]

[[env.staging.kv_namespaces]]
binding = "MEMBERS_KV"
id = "66834b9613a34d3eba014791e3b5000f"

[[env.staging.kv_namespaces]]
binding = "ATTENDANCE_KV"
id = "f6f23b3e546646d28a3a80f71ef35715"

[[env.staging.r2_buckets]]
binding = "VOICE"
bucket_name = "jxnfilm-voice-staging"

# Per-env, like VOICE: one bucket bound as production in both env blocks would
# let the staging Worker write production storage — the first binding here to
# break env isolation.
#   npx wrangler r2 bucket create jxnfilm-news-staging
[[env.staging.r2_buckets]]
binding = "NEWS"
bucket_name = "jxnfilm-news-staging"

[env.staging.vars]
ENVIRONMENT = "staging"                 # staging writes KV only; no repository_dispatch (prod JSON stays clean)
GITHUB_OWNER = "michaellambgelo"
GITHUB_REPO = "jxnfilmclub"
GITHUB_BRANCH = "main"                  # source branch for seeding KV from data/attendance.json
SITE_ORIGIN = "https://jxnfilm.club"
NEWSLETTER_FROM = "Jackson Film Club <noreply@join.jxnfilm.club>"
# NEWSLETTER_POSTAL_ADDRESS deliberately unset (see the production note).

# Envs don't inherit [triggers] — staging declares its own cron.
[env.staging.triggers]
crons = ["17 8 * * *"]

# Staging secrets are set separately:
#   npx wrangler secret put GITHUB_TOKEN     --env staging
#   npx wrangler secret put RESEND_API_KEY   --env staging
#   npx wrangler secret put OTP_SIGNING_KEY  --env staging
#   npx wrangler secret put ADMIN_TOKEN      --env staging

[observability]
[observability.logs]
enabled = true
invocation_logs = true
